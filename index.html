<!doctype html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pentru iubita mea</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg1: #fff2f8;
      --bg2: #ffd6e8;
      --bg3: #ffc2dc;
      --pink-1: #ff8fbd;
      --pink-2: #ff74ad;
      --pink-3: #ffb7d5;
      --letter: #fffafb;
      --ink: #9f2f63;
      --ink-soft: #b7497c;
      --heart: #ff2d74;
      --shadow: rgba(124, 30, 78, 0.28);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      display: grid;
      place-items: center;
      padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
      font-family: "Nunito", "Segoe UI", sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      background:
        radial-gradient(circle at 16% 14%, rgba(255, 255, 255, 0.78), transparent 33%),
        radial-gradient(circle at 82% 10%, rgba(255, 255, 255, 0.62), transparent 30%),
        linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 52%, var(--bg3) 100%);
    }

    .heart-rain {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .heart-rain span {
      position: absolute;
      top: -16vh;
      left: 0;
      color: var(--heart);
      opacity: 0.42;
      font-size: calc(16px + var(--size));
      text-shadow: 0 10px 20px rgba(255, 45, 116, 0.24);
      transform: translate3d(0, 0, 0);
      animation: rain var(--dur) linear infinite;
      animation-delay: var(--delay);
      user-select: none;
    }

    @keyframes rain {
      0% {
        transform: translate3d(var(--x), -15vh, 0) rotate(0deg);
      }
      100% {
        transform: translate3d(calc(var(--x) + var(--drift)), 115vh, 0) rotate(360deg);
      }
    }

    .scene {
      position: relative;
      z-index: 1;
      width: min(95vw, 680px);
      height: min(90vh, 760px);
      display: grid;
      place-items: center;
      align-content: center;
      gap: 0.65rem;
    }

    .title {
      margin: 0;
      text-align: center;
      font-size: clamp(1.2rem, 3.4vw, 1.9rem);
      color: var(--ink);
      letter-spacing: 0.02em;
    }

    .title span {
      display: block;
      margin-top: 0.12rem;
      font-family: "Great Vibes", serif;
      font-size: clamp(2.5rem, 8vw, 4rem);
      line-height: 0.95;
      color: #d9357f;
    }

    .envelope-btn {
      border: 0;
      background: transparent;
      padding: 0;
      width: min(88vw, 500px);
      aspect-ratio: 14 / 9;
      position: relative;
      cursor: pointer;
      touch-action: manipulation;
      outline-offset: 10px;
      filter: drop-shadow(0 30px 36px var(--shadow));
    }

    .envelope-btn:focus-visible {
      outline: 3px solid rgba(255, 255, 255, 0.95);
    }

    .envelope {
      position: absolute;
      inset: 0;
    }

    .back {
      position: absolute;
      inset: 0;
      background: var(--pink-1);
      border-bottom-left-radius: 10px;
      border-bottom-right-radius: 10px;
    }

    .front {
      position: absolute;
      width: 0;
      height: 0;
      z-index: 5;
    }

    .flap {
      border-left: min(44vw, 250px) solid transparent;
      border-right: min(44vw, 250px) solid transparent;
      border-top: min(30vw, 180px) solid var(--pink-2);
      border-bottom: min(26vw, 150px) solid transparent;
      transform-origin: top;
      transition: transform 0.75s cubic-bezier(.25, .8, .2, 1), z-index 0.4s;
      top: 0;
      left: 0;
      z-index: 8;
    }

    .pocket {
      border-left: min(44vw, 250px) solid var(--pink-3);
      border-right: min(44vw, 250px) solid var(--pink-3);
      border-bottom: min(29vw, 170px) solid var(--pink-1);
      border-top: min(28vw, 160px) solid transparent;
      border-bottom-left-radius: 10px;
      border-bottom-right-radius: 10px;
      top: 0;
      left: 0;
      z-index: 7;
    }

    .letter {
      position: absolute;
      left: 50%;
      bottom: 8%;
      width: 84%;
      height: 84%;
      transform: translate(-50%, 6%);
      border-radius: 12px;
      background: var(--letter);
      border: 1px solid rgba(248, 157, 198, 0.7);
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.95),
        0 14px 28px rgba(193, 64, 116, 0.17);
      z-index: 4;
      padding: clamp(0.9rem, 3vw, 1.5rem);
      text-align: center;
      display: grid;
      place-content: center;
      gap: 0.55rem;
      transition: transform 0.82s cubic-bezier(.2, .9, .2, 1);
    }

    .letter h2 {
      margin: 0;
      font-family: "Great Vibes", serif;
      font-size: clamp(2.4rem, 8.5vw, 4.1rem);
      line-height: 0.9;
      color: var(--ink);
      font-weight: 400;
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.45s ease, transform 0.45s ease;
    }

    .letter p {
      margin: 0;
      color: var(--ink-soft);
      font-size: clamp(0.95rem, 2.55vw, 1.18rem);
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.45s ease, transform 0.45s ease;
    }

    .seal {
      position: absolute;
      left: 50%;
      top: 50%;
      width: clamp(54px, 8vw, 68px);
      height: clamp(54px, 8vw, 68px);
      transform: translate(-50%, -50%);
      z-index: 10;
      transition: opacity 0.45s ease, transform 0.6s ease;
      filter: drop-shadow(0 8px 16px rgba(175, 35, 102, 0.3));
    }

    .seal::before,
    .seal::after {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--heart);
      border-radius: 50%;
    }

    .seal::before {
      transform: translateX(-26%) scale(0.82);
    }

    .seal::after {
      transform: translateX(26%) scale(0.82);
    }

    .seal span {
      position: absolute;
      inset: 0;
      border-radius: 14px;
      background: var(--heart);
      transform: rotate(45deg) scale(0.86);
    }

    .float-hearts {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 46%;
      height: 0;
      pointer-events: none;
      z-index: 6;
    }

    .float-heart {
      position: absolute;
      left: var(--left);
      bottom: 0;
      width: var(--w);
      height: var(--w);
      opacity: 0;
      transform: translateY(0) scale(0.7);
      animation: floatUp var(--t) ease-in forwards;
      animation-delay: var(--d);
    }

    .float-heart::before,
    .float-heart::after {
      content: "";
      position: absolute;
      inset: 0;
      background: #ff4f90;
      border-radius: 50%;
    }

    .float-heart::before {
      transform: translateX(-25%) scale(0.8);
    }

    .float-heart::after {
      transform: translateX(25%) scale(0.8);
    }

    .float-heart span {
      position: absolute;
      inset: 0;
      background: #ff4f90;
      border-radius: 10px;
      transform: rotate(45deg) scale(0.86);
    }

    @keyframes floatUp {
      0% {
        opacity: 0;
        transform: translateY(0) scale(0.7) rotate(0deg);
      }
      15% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translateY(-360px) translateX(var(--sway)) scale(1.08) rotate(28deg);
      }
    }

    .hint {
      margin: 0;
      color: #a03b70;
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.88);
      border-radius: 999px;
      padding: 0.42rem 0.9rem;
      font-size: clamp(0.86rem, 2.2vw, 1rem);
      animation: pulse 1.7s ease-in-out infinite;
      transition: opacity 0.35s ease;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .open .flap {
      transform: rotateX(180deg);
      z-index: 2;
    }

    .open .letter {
      transform: translate(-50%, -450%);
      z-index: 6;
      transition-delay: 1s;
    }

    .open .letter h2 {
      transition-delay: 1.22s;
    }

    .open .letter p {
      transition-delay: 1.32s;
    }

    .open .letter h2,
    .open .letter p {
      opacity: 1;
      transform: translateY(0);
    }

    .open .seal {
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.7);
    }

    .open ~ .hint {
      opacity: 0;
    }

    @media (max-width: 560px) {
      .scene {
        width: min(96vw, 680px);
        height: min(96dvh, 720px);
        gap: 0.42rem;
      }

      .title {
        font-size: clamp(1.08rem, 4.4vw, 1.36rem);
      }

      .title span {
        font-size: clamp(2.15rem, 11vw, 3.15rem);
      }

      .envelope-btn {
        width: min(96vw, 500px);
      }

      .letter {
        width: 86%;
        height: 82%;
        bottom: 9%;
      }

      .hint {
        padding: 0.34rem 0.76rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .heart-rain span,
      .flap,
      .letter,
      .seal,
      .letter h2,
      .letter p,
      .hint,
      .float-heart {
        animation: none;
        transition: none;
      }
    }
  </style>
</head>
<body>
  <div class="heart-rain" id="heartRain" aria-hidden="true"></div>

  <main class="scene">
    <h1 class="title">Un plic doar pentru tine<span>iubirea mea</span></h1>

    <button id="envelopeButton" class="envelope-btn" aria-expanded="false" aria-label="Deschide plicul">
      <div class="envelope">
        <div class="back"></div>
        <div class="letter">
          <h2>Te iubesc!</h2>
          <p>In fiecare zi cu tine e mai frumoasa decat ieri.</p>
          <p>Esti bucuria mea preferata.</p>
        </div>
        <div class="front flap"></div>
        <div class="front pocket"></div>
        <div class="seal" aria-hidden="true"><span></span></div>
        <div class="float-hearts" id="floatHearts" aria-hidden="true"></div>
      </div>
    </button>

    <p class="hint">Apasa pe plic</p>
  </main>

  <script>
    const envelopeButton = document.getElementById("envelopeButton");
    const heartRain = document.getElementById("heartRain");
    const floatHearts = document.getElementById("floatHearts");
    const LETTER_DELAY_MS = 1000;

    function spawnRainHearts() {
      const count = window.matchMedia("(max-width: 560px)").matches ? 22 : 34;
      for (let i = 0; i < count; i += 1) {
        const heart = document.createElement("span");
        heart.textContent = "♥";
        heart.style.setProperty("--x", `${Math.random() * 100}vw`);
        heart.style.setProperty("--drift", `${(Math.random() * 18 - 9).toFixed(2)}vw`);
        heart.style.setProperty("--dur", `${8 + Math.random() * 9}s`);
        heart.style.setProperty("--delay", `${-Math.random() * 12}s`);
        heart.style.setProperty("--size", `${Math.floor(Math.random() * 28) + 24}px`);
        heartRain.appendChild(heart);
      }
    }

    function burstHearts() {
      floatHearts.innerHTML = "";
      for (let i = 0; i < 9; i += 1) {
        const h = document.createElement("div");
        h.className = "float-heart";
        h.style.setProperty("--left", `${10 + Math.random() * 80}%`);
        h.style.setProperty("--w", `${22 + Math.random() * 20}px`);
        h.style.setProperty("--t", `${2.6 + Math.random() * 1.8}s`);
        h.style.setProperty("--d", `${Math.random() * 0.35}s`);
        h.style.setProperty("--sway", `${(Math.random() * 80 - 40).toFixed(1)}px`);
        h.innerHTML = "<span></span>";
        floatHearts.appendChild(h);
      }
    }

    envelopeButton.addEventListener("click", () => {
      const isOpen = envelopeButton.classList.toggle("open");
      envelopeButton.setAttribute("aria-expanded", isOpen ? "true" : "false");
      if (isOpen) {
        setTimeout(() => {
          if (envelopeButton.classList.contains("open")) {
            burstHearts();
          }
        }, LETTER_DELAY_MS);
      }
    });

    spawnRainHearts();
  </script>
</body>
</html>
