<!doctype html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Te iubesc</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-1: #fff0f6;
      --bg-2: #ffd9e8;
      --bg-3: #ffd0e1;
      --envelope: #f7a4be;
      --envelope-shadow: #ea8ead;
      --flap: #fbc0d4;
      --paper: #fffafc;
      --ink: #a13d6d;
      --heart: #ff4f8b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: "Quicksand", "Trebuchet MS", sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.75) 0%, rgba(255, 255, 255, 0) 35%),
        radial-gradient(circle at 80% 10%, rgba(255, 255, 255, 0.65) 0%, rgba(255, 255, 255, 0) 40%),
        linear-gradient(140deg, var(--bg-1) 0%, var(--bg-2) 52%, var(--bg-3) 100%);
      color: var(--ink);
    }

    .scene {
      position: relative;
      width: min(88vw, 420px);
      aspect-ratio: 1 / 1;
      display: grid;
      place-items: center;
      filter: drop-shadow(0 26px 38px rgba(145, 39, 90, 0.22));
    }

    .hint {
      position: absolute;
      top: 6%;
      left: 50%;
      transform: translateX(-50%);
      padding: 0.4rem 0.9rem;
      font-size: clamp(0.8rem, 2vw, 0.95rem);
      color: #8f3a63;
      background: rgba(255, 255, 255, 0.58);
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 999px;
      backdrop-filter: blur(4px);
      transition: opacity 0.4s ease;
      letter-spacing: 0.02em;
      user-select: none;
    }

    .envelope {
      position: relative;
      width: min(72vw, 320px);
      aspect-ratio: 7 / 5;
      border: 0;
      background: transparent;
      padding: 0;
      cursor: pointer;
      appearance: none;
      outline-offset: 10px;
    }

    .envelope:focus-visible {
      outline: 3px solid rgba(255, 255, 255, 0.9);
    }

    .envelope-base {
      position: absolute;
      inset: 0;
      border-radius: 0.8rem;
      background: var(--envelope);
      overflow: hidden;
    }

    .envelope-base::before,
    .envelope-base::after {
      content: "";
      position: absolute;
      width: 73%;
      height: 73%;
      background: var(--envelope-shadow);
      top: 56%;
      transform: translateY(-50%) rotate(45deg);
      border-radius: 0.35rem;
    }

    .envelope-base::before {
      left: -30%;
    }

    .envelope-base::after {
      right: -30%;
    }

    .flap {
      position: absolute;
      inset: 0;
      transform-origin: top;
      transition: transform 0.8s cubic-bezier(.2, .8, .2, 1);
      z-index: 3;
    }

    .flap::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      margin: auto;
      width: 100%;
      height: 100%;
      background: var(--flap);
      clip-path: polygon(0 0, 100% 0, 50% 62%);
      border-radius: 0.8rem;
    }

    .heart {
      position: absolute;
      top: 40%;
      left: 50%;
      width: 38px;
      height: 34px;
      transform: translate(-50%, -50%) rotate(-45deg);
      background: var(--heart);
      z-index: 4;
      transition: transform 0.8s ease;
      box-shadow: 0 8px 16px rgba(255, 79, 139, 0.35);
    }

    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 38px;
      height: 34px;
      border-radius: 50%;
      background: var(--heart);
    }

    .heart::before {
      top: -50%;
      left: 0;
    }

    .heart::after {
      left: 50%;
      top: 0;
    }

    .letter {
      position: absolute;
      left: 50%;
      bottom: 10%;
      transform: translate(-50%, 22%);
      width: 86%;
      height: 72%;
      background: var(--paper);
      border-radius: 0.7rem;
      display: grid;
      place-items: center;
      padding: 1.1rem;
      z-index: 2;
      transition: transform 0.8s cubic-bezier(.22, 1, .36, 1);
      border: 1px solid rgba(255, 177, 205, 0.72);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.9);
    }

    .letter p {
      margin: 0;
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(1.25rem, 5vw, 2.2rem);
      text-align: center;
      color: var(--ink);
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.55s ease 0.25s, transform 0.55s ease 0.25s;
    }

    .envelope.open .flap {
      transform: rotateX(180deg);
    }

    .envelope.open .letter {
      transform: translate(-50%, -44%);
    }

    .envelope.open .letter p {
      opacity: 1;
      transform: translateY(0);
    }

    .envelope.open .heart {
      transform: translate(-50%, -50%) rotate(-45deg) scale(0.92);
    }

    .envelope.open + .hint {
      opacity: 0;
    }

    @media (max-width: 460px) {
      .scene {
        width: 92vw;
      }

      .letter {
        padding: 0.8rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .flap,
      .letter,
      .letter p,
      .heart,
      .hint {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main class="scene" aria-label="Scrisoare de dragoste">
    <button class="envelope" id="envelope" aria-expanded="false" aria-label="Deschide plicul">
      <span class="envelope-base"></span>
      <span class="letter"><p>Te iubesc!</p></span>
      <span class="flap"></span>
      <span class="heart" aria-hidden="true"></span>
    </button>
    <p class="hint">Apasă pe plic</p>
  </main>

  <script>
    const envelope = document.getElementById("envelope");

    envelope.addEventListener("click", () => {
      envelope.classList.toggle("open");
      envelope.setAttribute("aria-expanded", envelope.classList.contains("open") ? "true" : "false");
    });
  </script>
</body>
</html>
